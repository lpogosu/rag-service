[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.5.0"
description = "Retrieval-augmented generation built from first principles: every stage visible, measurable and swappable"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lpogosu" }]
dependencies = [
    "fastapi==0.124.4",
    "uvicorn[standard]==0.33.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "numpy==2.4.2",
    "PyYAML==6.0.3",
    "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "respx==0.23.1",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.urls]
Homepage = "https://github.com/lpogosu/rag-service"

[tool.setuptools.packages.find]
include = ["rag*", "eval*", "api*"]

[tool.setuptools.package-data]
"eval.datasets" = ["*.jsonl"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["rag", "eval", "api", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return
    "PTH",   # pathlib
    "ASYNC",
    "S",     # bandit
    "T20",   # no print outside CLI entry points
    "RUF",
]
ignore = [
    "S101",     # asserts are the point in tests
    # The documentation, prompts and evaluation corpus are Russian on purpose, so
    # Cyrillic in string literals is not a homoglyph attack, it is the content.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["rag", "eval", "api", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"eval/harness.py" = ["T201"]
"eval/datasets/generate.py" = ["T201", "S311"]
"rag/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rag", "eval"]
branch = true
