# Fully offline profile: no model, no database, no network.
# Used by the test suite and by `make eval` so that published numbers are reproducible.
name: offline

chunking:
  strategy: structural
  options:
    max_chars: 900
    min_section_chars: 200

embedding:
  provider: hashing
  dim: 512
  seed: 20260214

store:
  backend: memory
  metric: cosine

lexical:
  enabled: true
  k1: 1.5
  b: 0.75
  use_stemming: true

retrieval:
  dense_k: 30
  lexical_k: 30
  final_k: 6
  fusion:
    method: rrf
    k: 60
    dense_weight: 0.5
    lexical_weight: 0.5

rerank:
  provider: none

generation:
  provider: extractive
  max_context_chars: 6000
  max_sentences: 3
