name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy --strict rag eval api tests

      # The whole suite is offline: the hashing embedder and the in-memory store need
      # no model, no GPU and no database, so CI needs no services.
      - name: Test
        run: python -m pytest

      - name: Evaluation corpus is reproducible
        run: |
          python -m eval.datasets.generate
          git diff --exit-code -- eval/datasets

      - name: Benchmark sweep
        run: python -m eval.harness --sweep

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: rag-service:ci
